# Netlify ayarları — site bu klasörün içeriği olduğu gibi yayınlanır (derleme adımı yok)
[build]
  publish = "."

# Görseller uzun süre önbellekte kalsın
# ("/dilekceler/*" kuralı /dilekceler sayfasını da yakalayıp 1 hafta eski gösterdiği için kaldırıldı)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Güvenlik başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
